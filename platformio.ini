; cymon — Cyphal network monitor firmware for ESP32-S2
; ESP-IDF framework via PlatformIO
; https://github.com/Tecnologic/cymon

[env:esp32s2mini]
platform = espressif32
board = lolin_s2_mini
framework = espidf
board_build.partitions = partitions.csv
board_build.filesystem = spiffs
board_build.embed_files =
  ; Add binary blobs here if needed

build_flags =
  -DCONFIG_FREERTOS_HZ=1000
  -Iinclude
  -Ilib/cymon-lib/include
  -std=gnu++20
  -Wall
  -Wextra
  -Werror=return-type

build_unflags =
  -std=gnu++11
  -std=gnu++14
  -std=gnu++17

lib_deps =
  ; libcanard and o1heap are vendored under lib/
  ; cymon-lib is a git submodule under lib/cymon-lib/

monitor_speed = 115200
upload_speed = 921600

[env:esp32s2mini_debug]
extends = env:esp32s2mini
build_type = debug
build_flags =
  ${env:esp32s2mini.build_flags}
  -DCORE_DEBUG_LEVEL=5
  -DCONFIG_LOG_DEFAULT_LEVEL=4
