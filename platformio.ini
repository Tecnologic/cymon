; cymon — Cyphal network monitor firmware for ESP32-S2
; ESP-IDF framework via PlatformIO
; https://github.com/Tecnologic/cymon

[env:esp32s2mini]
platform = espressif32
board = lolin_s2_mini
framework = espidf
board_build.partitions = partitions.csv
board_build.filesystem = spiffs
board_build.embed_files =
  ; Add binary blobs here if needed

build_flags =
  -Isrc
  -Iinclude
  -std=gnu++20
  -Wall
  -Wextra
  -Werror=return-type

build_unflags =
  -std=gnu++11
  -std=gnu++14
  -std=gnu++17

lib_deps =
  ; libcanard and o1heap are vendored under lib/libcanard and lib/o1heap

lib_ldf_mode = deep

monitor_speed = 115200
upload_speed = 921600
