[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "cymon"
version = "0.1.0"
description = "Cyphal admin tool: nodes, registers, commands, diagnostics, live subjects and cymon captures in the browser"
readme = "README.md"
license = "AGPL-3.0-or-later"
requires-python = ">=3.10"
authors = [{ name = "Tecnologic" }]
dependencies = [
  "pycyphal[transport-can-pythoncan,transport-udp]>=1.24,<2",
  "python-can>=4.5,<5",
  "pyserial>=3.5",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "websockets>=12",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "httpx>=0.27", "ruff>=0.6"]

[project.scripts]
cymon = "cymon_app.cli:main"

# python-can plugin: interface "canable" (CANable 2.0 slcan firmware in CAN FD mode).
[project.entry-points."can.interface"]
canable = "cymon_app.canable:CanableBus"

[tool.hatch.build.targets.wheel]
packages = ["src/cymon_app"]

# A wheel carries the DSDL it needs; a source checkout reads it from the submodules.
[tool.hatch.build.targets.wheel.force-include]
"lib/cymon-lib/dsdl/cymon" = "cymon_app/_dsdl/cymon"
"dsdl/public_regulated_data_types/uavcan" = "cymon_app/_dsdl/uavcan"
"dsdl/public_regulated_data_types/reg" = "cymon_app/_dsdl/reg"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
filterwarnings = [
  "ignore::DeprecationWarning:pycyphal.*",
  # uavcan.node.port.List.0.1 is what pycyphal and UNIMOC publish.
  "ignore:Data type uavcan.node.port:DeprecationWarning",
]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
# FastAPI declares request bodies with Body() defaults.
ignore = ["B008"]
