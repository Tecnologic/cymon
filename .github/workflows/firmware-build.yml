name: Firmware Build (ESP32-S2)

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  firmware-build:
    name: PlatformIO Build
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install PlatformIO
        run: |
          pip install platformio
          pio pkg update

      - name: Build firmware
        run: pio run --environment esp32s2mini

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: .pio/build/esp32s2mini/firmware.bin
          if-no-files-found: warn
