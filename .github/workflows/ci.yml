name: CI

on:
  # Pull requests only; a push to a branch runs nothing.
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: pip install -e '.[dev]'
      - name: Lint
        run: |
          ruff check src tests packaging
          ruff format --check src tests packaging
      - name: Test (simulated device on a virtual CAN bus)
        run: pytest -q

  build:
    uses: ./.github/workflows/build.yml
