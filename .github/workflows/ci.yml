name: Host Tests & Lint

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  host-tests:
    name: Build & Test (Linux)
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y cmake ninja-build clang-18 clang-format-18 clang-tidy-18 \
                                  libgtest-dev
          sudo ln -sf /usr/bin/clang-18      /usr/local/bin/clang
          sudo ln -sf /usr/bin/clang++-18    /usr/local/bin/clang++
          sudo ln -sf /usr/bin/clang-format-18 /usr/local/bin/clang-format
          sudo ln -sf /usr/bin/clang-tidy-18   /usr/local/bin/clang-tidy

      - name: Configure CMake
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_CXX_COMPILER=clang++ \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON

      - name: Build
        run: cmake --build build --parallel

      - name: Run tests
        run: ctest --test-dir build --output-on-failure

      - name: clang-format check
        run: |
          find include src tests -name '*.cpp' -o -name '*.hpp' | \
          xargs clang-format --dry-run --Werror

      - name: clang-tidy
        run: |
          find include src -name '*.cpp' | \
          xargs -I{} clang-tidy -p build {} -- \
            -std=c++20 -Iinclude -Itests/stubs 2>&1 | \
          grep -v "^$" || true
